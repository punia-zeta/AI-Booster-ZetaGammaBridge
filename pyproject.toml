[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeta-gamma-bridge"
version = "1.0.1"
description = "AI Booster — Algebraic packaging of Apéry's constant ζ(3) and the Euler-Mascheroni constant γ"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "CC-BY-NC-ND-4.0"}
authors = [
    {name = "Manoj Punia", email = "mspunia1976@gmail.com"}
]
keywords = [
    "apery",
    "zeta",
    "euler-mascheroni",
    "number-theory",
    "mathematical-constants",
    "high-precision",
    "ai-booster"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/punia-zeta/AI-Booster-ZetaGammaBridge"
Documentation = "https://github.com/punia-zeta/AI-Booster-ZetaGammaBridge"
Repository = "https://github.com/punia-zeta/AI-Booster-ZetaGammaBridge"
DOI = "https://doi.org/10.5281/zenodo.21839959"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zeta_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
